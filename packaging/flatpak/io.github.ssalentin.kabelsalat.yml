app-id: io.github.ssalentin.kabelsalat
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kabelsalat
rename-desktop-file: kabelsalat.desktop
rename-icon: kabelsalat

finish-args:
  # The app prefers X11 (XWayland renders it 1:1, see ui.rs run_app) and falls
  # back to native Wayland when no X server is reachable.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  # Audio: cpal opens ALSA (pipewire-alsa / pulse plugin); pactl, parec, paplay
  # and pw-record come from the runtime and talk to the sound server.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # /dev/snd: raw ALSA devices and the ALSA sequencer (midir, MIDI hot-plug).
  - --device=all
  # No org.freedesktop.RealtimeKit1: audio_thread_priority sends rtkit the
  # sandbox's thread id, which rtkit cannot resolve on the host. Realtime in
  # the sandbox needs the Realtime portal (docs/PACKAGING.md).
  # The assistant calls the configured model APIs (bring your own key).
  - --share=network
  # Same config, sessions, presets and recordings as a native install.
  - --filesystem=xdg-config/kabelsalat:create
  - --filesystem=~/kabelsalat-sessions:create
  - --filesystem=~/kabelsalat-rig-presets:create
  - --filesystem=xdg-music/kabelsalat:create
  - --persist=.cache/kabelsalat
  # Plugins: the user's own dirs, the host's system dirs (at /run/host) and
  # Flathub's LinuxAudio plugin extensions (at /app/extensions/Plugins).
  - --filesystem=~/.clap:create
  - --filesystem=~/.lv2:create
  - --filesystem=host-os:ro
  - --env=CLAP_PATH=/app/extensions/Plugins/clap:/run/host/usr/lib/clap:/run/host/usr/lib64/clap:/run/host/usr/local/lib/clap
  - --env=LV2_PATH=/app/extensions/Plugins/lv2:/run/host/usr/lib/lv2:/run/host/usr/lib64/lv2:/run/host/usr/local/lib/lv2

add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '26.08'
    add-ld-path: lib
    merge-dirs: clap;lv2;vst3
    subdirectories: true
    no-autodownload: true

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'

modules:
  - name: lv2
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dplugins=disabled
      - -Dtests=disabled
      - -Donline_docs=false
    sources:
      - type: archive
        url: https://lv2plug.in/spec/lv2-1.18.10.tar.xz
        sha256: 78c51bcf21b54e58bb6329accbb4dae03b2ed79b520f9a01e734bd9de530953f

  - name: zix
    buildsystem: meson
    config-opts:
      - -Dbenchmarks=disabled
      - -Ddocs=disabled
      - -Dtests=disabled
      - -Dtests_cpp=disabled
    sources:
      - type: archive
        url: https://download.drobilla.net/zix-0.8.2.tar.xz
        sha256: 4c73aab0f8cbbfe56b00c8c6d648316021e699c5ae6cbf254391ef309047e67b

  - name: serd
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dtests=disabled
      - -Dtools=disabled
    sources:
      - type: archive
        url: https://download.drobilla.net/serd-0.32.10.tar.xz
        sha256: b0e93b49e52f01a049475b7886ef140407115a32d3b1e5dc5f95141c88275d1c

  - name: sord
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dman=disabled
      - -Dtests=disabled
      - -Dtools=disabled
    sources:
      - type: archive
        url: https://download.drobilla.net/sord-0.16.22.tar.xz
        sha256: bb23b34b216579136795d518cffa73d91cf205594ce9accebfd408afb839173f

  - name: sratom
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://download.drobilla.net/sratom-0.6.22.tar.xz
        sha256: 0209b7d0f22c96abb416722ed735b0933be47931ecff4aa4b26ded7760b4f252

  - name: lilv
    buildsystem: meson
    config-opts:
      - -Dbindings_cpp=disabled
      - -Dbindings_py=disabled
      - -Ddocs=disabled
      - -Dtests=disabled
      - -Dtools=disabled
    sources:
      - type: archive
        url: https://download.drobilla.net/lilv-0.28.0.tar.xz
        sha256: 8dcb70adb5cf072335115a6b091f4113710bdc73abaadaa3f9e9c1e55957b149

  - name: kabelsalat
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/kabelsalat/cargo
        CARGO_NET_OFFLINE: 'true'
        RUSTFLAGS: -L/app/lib
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/kabelsalat /app/bin/kabelsalat
      - install -Dm644 packaging/kabelsalat.desktop /app/share/applications/kabelsalat.desktop
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/kabelsalat.svg
      - install -Dm644 packaging/flatpak/io.github.ssalentin.kabelsalat.metainfo.xml /app/share/metainfo/io.github.ssalentin.kabelsalat.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/kabelsalat/LICENSE
      - mkdir -p /app/extensions/Plugins
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .flatpak-builder
      - cargo-sources.json
