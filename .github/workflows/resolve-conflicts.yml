name: Resolve conflicts

# After every merge to main, inspect open PRs that now conflict.
#
# GitHub holds `pull_request` workflows triggered by a `GITHUB_TOKEN` push in
# `action_required` awaiting manual approval, and ignores `workflow_dispatch`
# check runs for required PR status checks — so pushing a bot merge commit
# strands PRs in `BLOCKED` without required checks. Instead, check conflicts
# read-only with `scripts/ci/resolve_appends.py`, apply the `merge-conflict`
# label with instructions to run `scripts/sync-branch.sh --push`, and remove
# the label once the PR is mergeable again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resolve-conflicts

jobs:
  resolve:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check open PRs for conflicts
        run: |
          cp scripts/ci/resolve_appends.py "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create merge-conflict --color D93F0B \
            --description "Conflicts with main that need a hand (resolve-conflicts.yml)" 2>/dev/null || true
          flag() { # <pr> <body_message>
            if ! gh pr view "$1" --json labels -q '.labels[].name' | grep -qx merge-conflict; then
              gh pr edit "$1" --add-label merge-conflict
              gh pr comment "$1" --body "$2"
            fi
          }
          for pr in $(gh pr list --state open --json number,isCrossRepository -q '.[] | select(.isCrossRepository | not) | .number'); do
            # GitHub computes mergeability lazily after a push to main.
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$pr" --json mergeable -q .mergeable)
              [ "$state" != UNKNOWN ] && break
              sleep 10
            done
            branch=$(gh pr view "$pr" --json headRefName -q .headRefName)
            echo "#$pr $branch: $state"
            if [ "$state" != CONFLICTING ]; then
              if gh pr view "$pr" --json labels -q '.labels[].name' | grep -qx merge-conflict; then
                gh pr edit "$pr" --remove-label merge-conflict
              fi
              continue
            fi
            git fetch -q origin "$branch"
            git checkout -q --detach FETCH_HEAD
            append_only=0
            if git merge -q --no-commit --no-ff origin/main; then
              append_only=1
            elif python3 "$RUNNER_TEMP/resolve_appends.py"; then
              append_only=1
            fi
            git merge --abort 2>/dev/null || git reset --hard -q FETCH_HEAD
            git clean -fdq
            if [ "$append_only" -eq 1 ]; then
              flag "$pr" "This PR conflicts with \`main\` (append-only Markdown conflict). Because a bot push with \`GITHUB_TOKEN\` cannot trigger required PR checks without manual approval, the bot no longer pushes merge commits. Run \`scripts/sync-branch.sh --push\` to rebase, auto-resolve the Markdown conflict, and run CI."
            else
              flag "$pr" "This PR conflicts with \`main\` (conflicts other than insertions into Markdown files). Run \`scripts/sync-branch.sh --push\`, resolve the conflicts, rerun gate tests, and push."
            fi
          done
