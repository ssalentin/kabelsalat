name: Release

on:
  push:
    tags: ['v*']
  # Nightly: every package from main as the rolling `nightly` pre-release, so
  # broken packaging shows up within a day instead of on release day.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag (e.g. v0.1.0) to build the tarball and AppImages
          for and attach to its release. Empty: test build of this ref, no release.
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    env:
      BACKFILL_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version and release metadata
        run: |
          if [ -n "$BACKFILL_TAG" ]; then
            # Backfill an existing tag: its own Cargo.toml decides the version.
            git fetch --depth=1 origin "refs/tags/$BACKFILL_TAG:refs/tags/$BACKFILL_TAG"
            crate=$(git show "$BACKFILL_TAG:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
            if [ "${BACKFILL_TAG#v}" != "$crate" ]; then
              echo "::error::tag $BACKFILL_TAG does not match its Cargo.toml version $crate"
              exit 1
            fi
            gh release view "$BACKFILL_TAG" > /dev/null
            echo "version=$crate" >> "$GITHUB_OUTPUT"
            echo "tag=$BACKFILL_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # Nothing merged since the last nightly: keep it, build nothing.
            last=$(git ls-remote origin refs/tags/nightly | cut -f1)
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "nightly is already at $GITHUB_SHA"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
              exit 1
            fi
            scripts/ci/release-notes.sh "$version" > /dev/null
            if ! grep -q "<release version=\"$version\"" packaging/flatpak/io.github.ssalentin.kabelsalat.metainfo.xml; then
              echo "::error::the metainfo has no <release version=\"$version\"> entry"
              exit 1
            fi
          else
            version="$crate-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF_TYPE" = tag ] && echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" || true
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Build tests
    needs: version
    if: ${{ !inputs.tag && needs.version.outputs.tag != '' && needs.version.outputs.skip != 'true' }}
    uses: ./.github/workflows/ci.yml

  binaries:
    name: tarball + AppImage (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - if: inputs.tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: tag-src
      # The packaging scripts come from this ref; the source from the
      # backfilled tag when there is one. The tag's tree moves out of this
      # checkout, or cargo takes ./Cargo.toml for its workspace root.
      - name: Source tree
        run: |
          if [ -d tag-src ]; then
            mv tag-src "$RUNNER_TEMP/src"
            echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"
          else
            echo "SRC=$PWD" >> "$GITHUB_ENV"
          fi
      - name: Install build dependencies
        run: scripts/ci/ubuntu-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.SRC }}
      - name: Build
        run: cargo build --release --locked --manifest-path "$SRC/Cargo.toml"
      - name: Tarball
        run: packaging/tarball.sh "$SRC/target/release/kabelsalat" "$VERSION" dist
      - name: AppImage
        run: packaging/appimage.sh "$SRC/target/release/kabelsalat" "$VERSION" dist
      - name: Smoke test
        run: |
          # Tags before --version existed (v0.1.0) print their usage ("modes:")
          # for it and exit 1; that still proves the binary loads and starts.
          smoke() {
            if [ -n "${{ inputs.tag }}" ]; then
              out=$("$@" --version 2>&1 || true); echo "$out"
              grep -qE "^(kabelsalat $VERSION|modes:)" <<<"$out"
            else
              "$@" --version
            fi
          }
          tar -xzf "dist/kabelsalat-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP"
          smoke "$RUNNER_TEMP/kabelsalat-$VERSION-linux-${{ matrix.arch }}/kabelsalat"
          smoke "dist/kabelsalat-${{ matrix.arch }}.AppImage" --appimage-extract-and-run
          "dist/kabelsalat-${{ matrix.arch }}.AppImage" --appimage-updateinformation \
            | grep -qx "gh-releases-zsync|${GITHUB_REPOSITORY/\//|}|latest|kabelsalat-${{ matrix.arch }}.AppImage.zsync"
          test -s "dist/kabelsalat-${{ matrix.arch }}.AppImage.zsync"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: version
    if: ${{ !inputs.tag && needs.version.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*') }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build bundle
        run: packaging/flatpak/build.sh "$VERSION" dist .flatpak-builder
      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive "dist/kabelsalat-$VERSION-${{ matrix.arch }}.flatpak"
          flatpak run --command=kabelsalat io.github.ssalentin.kabelsalat --version
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  arch-package:
    name: Arch package (${{ matrix.arch }})
    needs: version
    if: ${{ !inputs.tag && needs.version.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # actions/checkout needs git for a real clone; makepkg reads its history.
      # pacman 7's Landlock sandbox cannot be applied inside a container.
      - run: pacman --disable-sandbox -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: makepkg
        run: packaging/arch-makepkg.sh dist
      - name: Smoke test
        run: |
          pacman --disable-sandbox -U --noconfirm dist/*.pkg.tar.*
          kabelsalat --version
      - uses: actions/upload-artifact@v7
        with:
          name: arch-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    # A pushed tag publishes everything; a backfill attaches what it built
    # (flatpak and arch-package are skipped then, so they may not succeed).
    if: >-
      ${{ !cancelled() && needs.version.outputs.tag != '' && needs.binaries.result == 'success'
      && (inputs.tag || (needs.test.result == 'success' && needs.flatpak.result == 'success' && needs.arch-package.result == 'success')) }}
    needs: [version, test, binaries, flatpak, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the GitHub release
        run: |
          scripts/ci/release-notes.sh "$VERSION" dist "$TAG" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "kabelsalat $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  nightly:
    # Replaces the `nightly` pre-release (and its tag) with this build of main.
    # A pre-release is never "latest", so releases/latest/download links and
    # AppImage updates keep pointing at the last stable release.
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' && needs.binaries.result == 'success'
      && needs.flatpak.result == 'success' && needs.arch-package.result == 'success' }}
    needs: [version, binaries, flatpak, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Move the nightly pre-release to this commit
        run: |
          {
            echo "Automatic build of \`main\` at $GITHUB_SHA ($(date -u +%F))."
            echo "Not a release: it may break; stable versions are the other releases."
            echo
            echo "## Changes since the last release"
            echo
            python3 scripts/release.py notes
          } > "$RUNNER_TEMP/notes.md"
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/* --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "kabelsalat nightly $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
