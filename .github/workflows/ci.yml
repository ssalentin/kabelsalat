name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Every image is reviewed (AGENTS.md rule 108)
        run: scripts/check-images.sh
      - name: Install build dependencies
        run: scripts/ci/ubuntu-deps.sh
      # A real LV2 instrument, so lv2::tests::setbfree_plays_a_note runs
      # through lilv instead of skipping.
      - name: Install test plugins
        run: sudo apt-get install -y -q --no-install-recommends setbfree
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: scripts/ci/test.sh
