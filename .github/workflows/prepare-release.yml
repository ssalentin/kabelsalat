name: Prepare release

# Actions → "Prepare release" → Run (or `gh workflow run prepare-release.yml
# -f bump=minor`): bumps the version, folds changes/*.md into CHANGELOG.md,
# adds the metainfo entry and queues the PR for auto-merge. Once it merges,
# tag-release.yml tags it and release.yml publishes every package.
# Refuses while bench issues are open: merged changes nobody has tested on
# real hardware yet (AGENTS.md, "Bench tests"). `-f skip_bench=true`
# releases anyway.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major or an explicit X.Y.Z
        required: true
        default: minor
        type: string
      skip_bench:
        description: Release although bench issues are open
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: prepare-release

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Every merged change is tested on real hardware
        if: ${{ !inputs.skip_bench }}
        run: python3 scripts/ci/bench.py gate
      - name: Bump version, CHANGELOG and metainfo
        id: bump
        run: |
          version=$(python3 scripts/release.py prepare "$BUMP")
          if git ls-remote --exit-code origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          scripts/ci/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --stat
      - name: Open the release PR and queue it
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch=release-$VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A CHANGELOG.md Cargo.toml Cargo.lock changes packaging/flatpak
          git commit -q -m "release: v$VERSION"
          git push -u origin "$branch"
          {
            echo "Release **v$VERSION**, prepared by \`prepare-release.yml\` (bump: \`$BUMP\`)."
            echo "Approve the pending \`pull_request\` workflow runs on this PR to run CI and let auto-merge land it."
            echo "Merging tags it and publishes every package (\`tag-release.yml\` → \`release.yml\`)."
            echo
            echo "## Notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Release v$VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
          gh pr merge "$branch" --auto --squash
          # A PR opened with GITHUB_TOKEN puts pull_request runs into
          # action_required until a maintainer approves them (workflow_dispatch
          # check runs are ignored by branch protection). Once approved CI passes,
          # auto-merge lands the PR and tag-release.yml tags it via workflow_run.
