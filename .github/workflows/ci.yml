name: CI

# PRs run once (pull_request); main runs again after each merge, because main
# does not require branches to be up to date (docs/PACKAGING.md, "CI").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Every image is reviewed (AGENTS.md rule 108)
        run: scripts/check-images.sh
      - name: Changelog fragments are well-formed
        run: python3 scripts/release.py check
      # setbfree: a real LV2 instrument, so lv2::tests::setbfree_plays_a_note
      # runs through lilv instead of skipping.
      - name: Install build dependencies and test plugins
        run: scripts/ci/ubuntu-deps.sh setbfree
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: scripts/ci/test.sh
