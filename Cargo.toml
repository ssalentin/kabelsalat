[package]
name = "kabelsalat"
version = "0.3.0"
edition = "2021"
description = "Live audio/MIDI wiring, alive — an AUM-style plugin host with animated cables"
license = "MIT"
repository = "https://github.com/ssalentin/kabelsalat"
readme = "README.md"
keywords = ["audio", "midi", "plugin-host", "clap", "live"]
categories = ["multimedia::audio"]
publish = false

[dependencies]
anyhow = "1.0.104"
clack-extensions = { version = "0.2.0", features = ["all-extensions", "clack-host"] }
clack-host = "0.2.0"
cpal = "0.18.2"
# rtkit (D-Bus) realtime promotion of the audio callback thread: cpal skips
# RT for pipewire-alsa (IOPLUG) devices, so the app promotes it itself.
audio_thread_priority = { version = "0.35.1", features = ["with_dbus"] }
# Default features minus `accesskit`, the screen-reader bridge (AT-SPI over
# zbus). The rack is custom-painted and exposes nothing through it. Add
# "accesskit" back here to restore it for the standard widgets.
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard", "default_fonts", "links", "system_fonts", "wayland", "wgpu", "x11",
] }
egui = "0.37.0"
# Keeps winit's default features (client-side window decorations on Wayland),
# which eframe only turns on through its own default feature set.
winit = "0.30.13"
libc = "0.2"
vst3 = "0.3.0"
x11rb = { version = "0.14.0", features = ["randr"] }
midir = "0.11.1"
# Agent image input: encode app screenshots / pasted images for vision models.
png = "0.18.1"
base64 = "0.23.1"
rmcp = { version = "3.10", features = ["server", "transport-io", "macros"] }
schemars = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs", "time"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The C ABI, for the test plugin in src/host/probe.rs (clack-host already builds it).
clap-sys = "0.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The audio callback runs in debug builds too (the app is usually launched from
# target/debug): unoptimized DSP + plugin hosting underran the 10.7 ms buffer.
# Optimize the crate lightly and dependencies fully; debug info stays.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
