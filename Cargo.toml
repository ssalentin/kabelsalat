[package]
name = "kabelsalat"
version = "0.0.1"
edition = "2021"
description = "Live audio/MIDI wiring, alive — an AUM-style plugin host with animated cables"
publish = false

[dependencies]
anyhow = "1.0.104"
clack-extensions = { version = "0.2.0", features = ["all-extensions", "clack-host"] }
clack-host = "0.2.0"
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37.0"
libc = "0.2"
midir = "0.11.1"
rmcp = { version = "3.10", features = ["server", "transport-io", "macros"] }
schemars = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "fs"] }
x11rb = "0.14.0"

[profile.release]
lto = "thin"
codegen-units = 1
